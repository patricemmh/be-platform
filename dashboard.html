<!DOCTYPE html>
<!-- Run: npm run dashboard — then open http://localhost:3001/dashboard.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetterEngineer · My Linear</title>
<link rel="stylesheet" href="https://use.typekit.net/lhs7vwi.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
  --page: #fafafa;
  --white: #ffffff;
  --text: #222;
  --ink: #333;
  --muted: #8a8a8a;
  --line: #ececec;
  --card-line: #e4e4e4;
  --blue: #4c60b2;
  --green: #319243;
  --shadow: 0 1px 2px rgba(0,0,0,0.14), 0 2px 6px rgba(0,0,0,0.07), 0 0 0.5px rgba(0,0,0,0.14);
  --font: "runda", system-ui, sans-serif;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --drawer-w: 420px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; }
button { cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  height: 64px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
}
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 500; color: var(--ink); }
.brand span { font-size: 13px; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.issue-lookup {
  display: flex; align-items: center; gap: 6px;
}
.issue-lookup-input {
  width: min(200px, 38vw);
  height: 38px; padding: 0 12px;
  border: 1px solid #dcdcdc; border-radius: 4px;
  font-size: 14px;
}
.issue-lookup-input:focus { outline: 2px solid #c8d4ec; outline-offset: 0; border-color: #c8d4ec; }
.issue-lookup-input.has-error { border-color: #e0a0a0; }
.issue-lookup-error {
  position: absolute; top: calc(100% + 4px); right: 0;
  font-size: 12px; color: #b33; white-space: nowrap;
  max-width: min(280px, 90vw); overflow: hidden; text-overflow: ellipsis;
}
.issue-lookup-wrap { position: relative; }
.issue-row.issue-highlight, .child-row.issue-highlight {
  background: #eef3ff !important;
  box-shadow: inset 0 0 0 2px #c8d4ec;
}
.btn {
  height: 38px; padding: 0 16px;
  border-radius: 4px; border: 1px solid #dcdcdc;
  background: #fff; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 8px;
  transition: filter .15s var(--ease);
}
.btn:hover { filter: brightness(.97); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-toggle[aria-pressed="true"] {
  background: #eef1f8;
  border-color: #c8d4ec;
  color: var(--blue);
}

.filter-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin-bottom: 20px;
}
.filter-bar-label {
  font-size: 12px; font-weight: 500; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
  margin-right: 4px;
}
.status-chip {
  height: 30px; padding: 0 12px;
  border-radius: 99px; border: 1px solid #dcdcdc;
  background: #fff; font-size: 12px; font-weight: 500;
  color: var(--ink);
  transition: background .12s var(--ease), border-color .12s var(--ease), color .12s var(--ease);
}
.status-chip:hover { filter: brightness(.97); }
.status-chip[aria-pressed="true"] {
  background: var(--blue); border-color: var(--blue); color: #fff;
}
.status-chip[aria-pressed="false"] { opacity: .55; }
.filter-bar-hint { font-size: 12px; color: var(--muted); margin-left: auto; }

.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.app-body {
  display: flex;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}
.main-column {
  flex: 1 1 auto;
  min-width: 0;
  overflow-y: auto;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 24px 80px; }

.banner {
  background: #fff8e6;
  border: 1px solid #f0dfa0;
  border-radius: 6px;
  padding: 16px 18px;
  margin-bottom: 24px;
  font-size: 14px;
  line-height: 1.5;
}
.banner code { background: #fff; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
.banner.error { background: #fdecec; border-color: #f0b4b4; }

.meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; font-size: 13px; color: var(--muted);
}
.meta strong { color: var(--ink); font-weight: 500; }

.card {
  background: var(--white);
  border: 1px solid var(--card-line);
  border-radius: 6px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
}

.issue-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 16px 18px;
  border-top: 1px solid var(--line);
  cursor: pointer;
  transition: background .12s var(--ease);
}
.issue-row:first-child { border-top: 0; }
.issue-row:hover { background: #f7f8fc; }
.issue-row.is-parent { background: #fcfcfd; }

.id-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 4px; }
.identifier {
  font-size: 12px; font-weight: 500; color: var(--blue);
  letter-spacing: .02em;
}
.status-pill {
  font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: 99px;
  background: #eef1f8; color: var(--blue);
}
.status-pill.done { background: #e8f5eb; color: var(--green); }
.status-pill.canceled { background: #f3f3f3; color: var(--muted); }
.title { font-size: 15px; font-weight: 500; color: var(--ink); line-height: 1.35; }
.sub-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.row-actions { display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.ext-link {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 4px; color: var(--blue);
  border: 1px solid transparent;
}
.ext-link:hover { background: #eef1f8; text-decoration: none; }

.children { border-top: 1px solid var(--line); background: #fafbfe; }
.child-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 14px 18px 14px 36px;
  border-top: 1px dashed var(--line);
  cursor: pointer;
}
.btn-mark-done {
  height: 32px;
  padding: 0 12px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 4px;
  border: 1px solid #c8d4ec;
  background: #fff;
  color: var(--green);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-mark-done:hover { background: #e8f5eb; filter: none; }
.btn-mark-done:disabled { opacity: .55; cursor: not-allowed; }
.btn-mark-done.is-busy { pointer-events: none; opacity: .7; }
.child-row:hover:not(:has(.check-item:hover)) { background: #f3f5fb; }
.child-row .identifier { font-size: 11px; }

.checklist { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.check-item {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; line-height: 1.4; color: var(--ink);
  padding: 6px 8px;
  margin: 0 -8px;
  border-radius: 4px;
  position: relative;
  transition: background .12s var(--ease);
}
.check-item:hover { background: #eef1f8; }
.check-item input {
  margin: 0; width: 16px; height: 16px;
  accent-color: var(--blue); flex-shrink: 0; cursor: pointer;
}
.check-item-text {
  flex: 1; min-width: 0;
  user-select: text; cursor: text;
}
.check-item.done .check-item-text { color: var(--muted); text-decoration: line-through; }
.check-item-actions {
  display: flex; align-items: center; gap: 2px;
  flex-shrink: 0; opacity: 0;
  transition: opacity .12s var(--ease);
}
.check-item:hover .check-item-actions { opacity: 1; }
.check-item-btn {
  width: 28px; height: 28px;
  border: 0; border-radius: 4px;
  background: transparent; color: var(--muted);
  display: grid; place-items: center;
  font-size: 13px;
  transition: background .12s var(--ease), color .12s var(--ease);
}
.check-item-btn:hover { background: #eef1f8; color: var(--blue); }
.check-item-btn.check-item-btn-danger:hover { background: #fdecec; color: #c0392b; }
.check-item-btn.is-copied { color: var(--green); }
.check-item.is-busy { opacity: .6; pointer-events: none; }

.checklist-modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0, 0, 0, 0.28);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.checklist-modal {
  width: min(360px, 100%);
  background: #fff;
  border: 1px solid var(--card-line);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 20px 22px;
}
.checklist-modal p {
  margin: 0 0 18px;
  font-size: 14px; line-height: 1.5; color: var(--ink);
}
.checklist-modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
}
.checklist-modal-actions .btn-danger {
  background: #c0392b; border-color: #c0392b; color: #fff;
}
.checklist-modal-actions .btn-danger:hover { filter: brightness(.95); }

.section-label {
  font-size: 12px; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted);
  margin: 28px 0 10px;
}

.empty {
  text-align: center; padding: 48px 24px;
  color: var(--muted); font-size: 14px;
}

/* drawer — push layout (sits beside main, no scrim) */
.drawer {
  flex: 0 0 0;
  width: min(var(--drawer-w), 50vw);
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #fff;
  border-left: 1px solid transparent;
  transition: flex-basis .25s var(--ease), border-color .25s var(--ease);
  display: flex;
  flex-direction: column;
  align-self: stretch;
}
.drawer.open {
  flex-basis: min(var(--drawer-w), 50vw);
  border-left-color: var(--line);
}
@media (max-width: 720px) {
  .app-body { overflow-x: auto; }
  .main-column { flex: 1 0 auto; min-width: 260px; }
  .drawer { max-width: min(var(--drawer-w), 42vw); }
  .drawer.open { flex-basis: min(var(--drawer-w), 42vw); }
}
.drawer-head {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; gap: 12px;
}
.drawer-head h2 { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.35; }
.drawer-close {
  width: 36px; height: 36px; border: 0; background: transparent;
  border-radius: 4px; color: var(--muted); font-size: 18px;
}
.drawer-close:hover { background: #f3f3f3; color: var(--ink); }
.drawer-body { padding: 20px; overflow: auto; flex: 1; font-size: 14px; line-height: 1.55; }
.drawer-kv { display: grid; gap: 10px; margin-bottom: 20px; }
.drawer-kv div { display: flex; gap: 8px; font-size: 13px; }
.drawer-kv dt { width: 72px; flex-shrink: 0; color: var(--muted); }
.drawer-kv dd { margin: 0; color: var(--ink); flex: 1; min-width: 0; }
.assignee-picker { position: relative; width: 100%; max-width: 280px; }
.assignee-trigger {
  width: 100%; min-height: 36px; padding: 6px 10px;
  border: 1px solid #dcdcdc; border-radius: 4px;
  background: #fff; font-size: 13px; font-weight: 500;
  text-align: left; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; color: var(--ink);
}
.assignee-trigger:hover { border-color: #c8d4ec; background: #f7f8fc; }
.assignee-trigger:focus { outline: 2px solid #c8d4ec; outline-offset: 0; border-color: #c8d4ec; }
.assignee-trigger.is-open { border-color: #c8d4ec; background: #f7f8fc; }
.assignee-trigger i { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.assignee-menu {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30;
  background: #fff; border: 1px solid var(--card-line); border-radius: 6px;
  box-shadow: var(--shadow); max-height: 280px; display: flex; flex-direction: column;
}
.assignee-menu[hidden] { display: none !important; }
.assignee-menu .assignee-search { margin: 10px 10px 8px; width: calc(100% - 20px); }
.assignee-options { overflow: auto; flex: 1; list-style: none; margin: 0; padding: 0 0 6px; }
.assignee-option {
  display: block; width: 100%; padding: 10px 14px; border: 0; background: transparent;
  text-align: left; font-size: 13px; cursor: pointer; color: var(--ink);
}
.assignee-option:hover, .assignee-option:focus { background: #f7f8fc; color: var(--blue); outline: none; }
.assignee-option[aria-selected="true"] { background: #eef1f8; color: var(--blue); font-weight: 500; }
.assignee-option small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.assignee-picker.is-busy .assignee-trigger { opacity: .55; pointer-events: none; }
.label-chip {
  display: inline-block; font-size: 11px; padding: 2px 8px;
  border-radius: 4px; background: #eef1f8; color: var(--blue);
  margin-right: 4px; margin-bottom: 4px;
}
.md h2, .md h3 { font-size: 15px; font-weight: 500; margin: 16px 0 8px; }
.md p { margin: 0 0 10px; }
.md ul { margin: 0 0 10px; padding-left: 1.25em; }
.md li { margin-bottom: 4px; }
.md code { background: #f4f4f4; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.md a { word-break: break-word; }

.pages-hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; line-height: 1.45; }
.pages-search {
  width: 100%; height: 38px; padding: 0 12px;
  border: 1px solid #dcdcdc; border-radius: 4px;
  font-size: 14px; margin-bottom: 12px;
}
.pages-search:focus { outline: 2px solid #c8d4ec; outline-offset: 0; border-color: #c8d4ec; }
.page-list { list-style: none; margin: 0; padding: 0; }
.page-list li { border-top: 1px solid var(--line); }
.page-list li[hidden] { display: none; }
.page-list li:first-child { border-top: 0; }
.page-link {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 2px; color: var(--ink); text-decoration: none;
  font-size: 14px; font-weight: 500;
}
.page-link:hover { color: var(--blue); text-decoration: none; background: #f7f8fc; margin: 0 -8px; padding-left: 10px; padding-right: 10px; border-radius: 4px; }
.page-link small { font-size: 11px; font-weight: 400; color: var(--muted); }
.page-link i { font-size: 13px; color: var(--blue); flex-shrink: 0; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<link rel="stylesheet" href="dev-tools/dev-tools.css">
<script src="dev-tools/dev-tools.js" defer></script>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <h1>My Linear</h1>
      <span id="viewerLabel">BetterEngineer</span>
    </div>
    <div class="tools">
      <form class="issue-lookup" id="issueLookupForm" role="search" aria-label="Open issue by ID">
        <div class="issue-lookup-wrap">
          <input
            type="search"
            class="issue-lookup-input"
            id="issueLookupInput"
            placeholder="Open by ID e.g. BE-689"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="issueLookupError"
            title="Open ticket (/) — BE-689, be689, or 689"
          />
          <span class="issue-lookup-error" id="issueLookupError" role="alert" hidden></span>
        </div>
        <button type="submit" class="btn" id="issueLookupBtn" title="Open ticket">
          <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i> Open
        </button>
      </form>
      <button type="button" class="btn btn-toggle" id="hideChecklistDoneBtn" aria-pressed="false" title="Hide completed checklist items in sub-issues">
        <i class="fa-solid fa-list-check"></i> Hide done checklist
      </button>
      <button type="button" class="btn btn-toggle" id="pagesBtn" aria-pressed="false" title="Prototype HTML pages in this repo">
        <i class="fa-solid fa-file-lines"></i> Pages
      </button>
      <button type="button" class="btn" id="refreshBtn" title="Refresh from Linear">
        <i class="fa-solid fa-rotate-right"></i> Refresh
      </button>
    </div>
  </header>

  <div class="app-body">
    <div class="main-column">
      <main class="wrap">
        <div id="setupBanner" class="banner" hidden></div>
        <div class="meta" id="metaRow" hidden>
          <span>Assigned to <strong id="viewerName">—</strong></span>
          <span id="fetchedAt">—</span>
        </div>
        <div class="filter-bar" id="statusFilterBar" hidden>
          <span class="filter-bar-label">Status</span>
          <div id="statusChips" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
          <span class="filter-bar-hint" id="statusFilterHint"></span>
        </div>
        <div id="board"></div>
      </main>
    </div>

    <aside class="drawer" id="drawer" aria-label="Issue details" aria-hidden="true">
      <div class="drawer-head">
        <h2 id="drawerTitle">—</h2>
        <button type="button" class="drawer-close" id="drawerClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>
</div>

<div id="checklistConfirmRoot" hidden></div>

<script>
const board = document.getElementById("board");
const setupBanner = document.getElementById("setupBanner");
const metaRow = document.getElementById("metaRow");
const viewerName = document.getElementById("viewerName");
const fetchedAt = document.getElementById("fetchedAt");
const refreshBtn = document.getElementById("refreshBtn");
const pagesBtn = document.getElementById("pagesBtn");
const hideChecklistDoneBtn = document.getElementById("hideChecklistDoneBtn");
const statusFilterBar = document.getElementById("statusFilterBar");
const statusChips = document.getElementById("statusChips");
const statusFilterHint = document.getElementById("statusFilterHint");
const drawer = document.getElementById("drawer");
const drawerTitle = document.getElementById("drawerTitle");
const drawerBody = document.getElementById("drawerBody");

const PREFS_KEY = "be-linear-dashboard-prefs";

let state = { parents: [], standalone: [], viewer: null };
let statusCatalog = new Map();
let prefs = { hideCompletedChecklist: false, enabledStatuses: [] };
let openDrawerIssueId = null;
/** Right drawer mode: one panel — Pages replaces issue detail (not a second column). */
let drawerMode = null;
let cachedPagesList = null;
let cachedUsersList = null;
let appConfig = {
  localPrototypeBase: "",
  githubPagesBase: "https://patricemmh.github.io/be-platform/",
};

const GH_PAGES_PATH_RE = /^https?:\/\/patricemmh\.github\.io\/be-platform\/(.+)$/i;
const GH_PAGES_MD_LINK_RE =
  /\[([^\]]*)\]\((https?:\/\/patricemmh\.github\.io\/be-platform\/[^)]+)\)/gi;
const GH_PAGES_BARE_IN_TEXT_RE =
  /(?<![="'/])https?:\/\/patricemmh\.github\.io\/be-platform\/[^\s<)\]"']+/gi;

function readStoredPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {};
  }
}

function writeStoredPrefs() {
  localStorage.setItem(
    PREFS_KEY,
    JSON.stringify({
      hideCompletedChecklist: prefs.hideCompletedChecklist,
      enabledStatuses: prefs.enabledStatuses,
    })
  );
}

function applyPrefsFromStorage() {
  const stored = readStoredPrefs();
  prefs.hideCompletedChecklist = Boolean(stored.hideCompletedChecklist);
  hideChecklistDoneBtn.setAttribute("aria-pressed", prefs.hideCompletedChecklist ? "true" : "false");
  if (Array.isArray(stored.enabledStatuses)) {
    prefs.enabledStatuses = stored.enabledStatuses;
  }
}

function collectAllIssues(data = state) {
  const list = [];
  for (const p of data.parents || []) {
    list.push(p);
    for (const c of p.children || []) list.push(c);
  }
  for (const i of data.standalone || []) list.push(i);
  return list;
}

function buildStatusCatalog(data) {
  const map = new Map();
  for (const issue of collectAllIssues(data)) {
    if (issue.status && !map.has(issue.status)) {
      map.set(issue.status, issue.statusType || "");
    }
  }
  return map;
}

function isCanceledStatus(statusName, statusType) {
  return statusType === "canceled" || /^canceled$/i.test(statusName || "");
}

function defaultEnabledStatuses(catalog) {
  return [...catalog.keys()].filter((name) => !isCanceledStatus(name, catalog.get(name)));
}

function syncEnabledStatusesWithCatalog() {
  const names = [...statusCatalog.keys()];
  if (!names.length) {
    prefs.enabledStatuses = [];
    return;
  }
  const stored = readStoredPrefs();
  const hadSaved = Array.isArray(stored.enabledStatuses) && stored.enabledStatuses.length;
  const defaults = defaultEnabledStatuses(statusCatalog);
  if (!hadSaved && !prefs.enabledStatuses.length) {
    prefs.enabledStatuses = defaults;
    return;
  }
  const kept = prefs.enabledStatuses.filter((s) => statusCatalog.has(s));
  const newcomers = names.filter((s) => !kept.includes(s) && !isCanceledStatus(s, statusCatalog.get(s)));
  prefs.enabledStatuses = [...kept, ...newcomers];
  if (!prefs.enabledStatuses.length) prefs.enabledStatuses = defaults.length ? defaults : names;
}

function issuePassesStatusFilter(issue) {
  if (!statusCatalog.size) return true;
  return prefs.enabledStatuses.includes(issue.status);
}

function countIssuesInData(data) {
  return collectAllIssues(data).length;
}

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function statusClass(statusType, status) {
  if (statusType === "completed" || status === "Done") return "done";
  if (statusType === "canceled") return "canceled";
  return "";
}

function prototypeRelPath(publishedUrl) {
  const m = String(publishedUrl).trim().match(GH_PAGES_PATH_RE);
  if (!m) return null;
  return m[1].replace(/[#?].*$/, "");
}

function localPrototypePathSegment(relPath) {
  let seg = String(relPath).replace(/^\//, "").replace(/[#?].*$/, "");
  if (seg.endsWith(".html")) seg = seg.slice(0, -5);
  return seg;
}

function localPrototypeUrl(relPath) {
  const base = appConfig.localPrototypeBase.replace(/\/$/, "");
  const seg = localPrototypePathSegment(relPath);
  return seg ? `${base}/${seg}` : base;
}

/** First patricemmh.github.io/be-platform URL in text (markdown links vs bare: earliest index wins). */
function firstPrototypeRelInText(text) {
  if (!text) return null;
  const s = String(text);
  let best = null;
  let bestIdx = Infinity;
  const consider = (url, idx) => {
    const rel = prototypeRelPath(url);
    if (rel != null && idx < bestIdx) {
      bestIdx = idx;
      best = rel;
    }
  };
  for (const m of s.matchAll(GH_PAGES_MD_LINK_RE)) consider(m[2], m.index);
  for (const m of s.matchAll(GH_PAGES_BARE_IN_TEXT_RE)) consider(m[0], m.index);
  return best;
}

/** Prototype path for card icon: description, then checklist items, then title. */
function issuePrototypeRelPath(issue) {
  let rel = firstPrototypeRelInText(issue.description);
  if (rel) return rel;
  for (const item of issue.checklist || []) {
    rel = firstPrototypeRelInText(item.text);
    if (rel) return rel;
  }
  return firstPrototypeRelInText(issue.title);
}

function renderMarkdown(md) {
  if (!md) return "<p class=\"muted\">No description.</p>";
  let t = escapeHtml(md);
  t = t.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  t = t.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  const mdLinks = [];
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
    const i = mdLinks.length;
    mdLinks.push({ label, href });
    return `\x00MD${i}\x00`;
  });
  t = t.replace(/\x00MD(\d+)\x00/g, (_, idx) => {
    const { label, href } = mdLinks[Number(idx)];
    return `<a href="${href}" target="_blank" rel="noopener">${label}</a>`;
  });
  t = t.replace(/^- \[([ xX])\] (.+)$/gm, (_, c, text) =>
    `<li><input type="checkbox" disabled ${c.toLowerCase() === "x" ? "checked" : ""}> ${text}</li>`
  );
  t = t.replace(/(^|\n)(- .+(?:\n- .+)*)/g, (m) => {
    if (m.includes("<li>")) return m;
    const items = m.trim().split("\n").map((line) => line.replace(/^- /, "")).join("</li><li>");
    return `<ul><li>${items}</li></ul>`;
  });
  t = t.split(/\n\n+/).map((block) => {
    if (/^<(h[23]|ul|li)/.test(block.trim())) return block;
    return `<p>${block.replace(/\n/g, "<br>")}</p>`;
  }).join("");
  return `<div class="md">${t}</div>`;
}

function issueLink(issue) {
  const rel = issuePrototypeRelPath(issue);
  const base = appConfig.localPrototypeBase?.replace(/\/$/, "");
  if (!rel || !base) return "";
  const href = localPrototypeUrl(rel);
  return `<a class="ext-link" href="${escapeHtml(href)}" target="_blank" rel="noopener" title="Open local prototype" onclick="event.stopPropagation()"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>`;
}

function renderChecklist(issue) {
  if (!issue.checklist?.length) return "";
  const items = issue.checklist
    .map((item, idx) => {
      if (prefs.hideCompletedChecklist && item.checked) return "";
      const done = item.checked ? "done" : "";
      const text = escapeHtml(item.text || "(empty)");
      return `<div class="check-item ${done}" data-issue="${escapeHtml(issue.id)}" data-idx="${idx}">
      <input type="checkbox" aria-label="Toggle checklist item" ${item.checked ? "checked" : ""} />
      <span class="check-item-text">${text}</span>
      <div class="check-item-actions">
        <button type="button" class="check-item-btn" data-check-copy title="Copy text" aria-label="Copy text"><i class="fa-regular fa-copy"></i></button>
        <button type="button" class="check-item-btn check-item-btn-danger" data-check-delete title="Delete item" aria-label="Delete item"><i class="fa-regular fa-trash-can"></i></button>
      </div>
    </div>`;
    })
    .join("");
  if (!items) return "";
  return `<div class="checklist">${items}</div>`;
}

function findIssueById(id) {
  for (const p of state.parents || []) {
    if (p.id === id) return p;
    for (const c of p.children || []) if (c.id === id) return c;
  }
  return (state.standalone || []).find((i) => i.id === id) || null;
}

function normalizeIdentifierForCompare(raw) {
  const s = String(raw ?? "").trim().toUpperCase();
  const m = s.match(/^([A-Z]+)[\s-]*(\d+)$/);
  if (m) return `${m[1]}-${m[2]}`;
  if (/^\d+$/.test(s)) return `BE-${s}`;
  return s;
}

function findIssueByIdentifier(identifier) {
  const want = normalizeIdentifierForCompare(identifier);
  for (const p of state.parents || []) {
    if (normalizeIdentifierForCompare(p.identifier) === want) return p;
    for (const c of p.children || []) {
      if (normalizeIdentifierForCompare(c.identifier) === want) return c;
    }
  }
  return (
    (state.standalone || []).find(
      (i) => normalizeIdentifierForCompare(i.identifier) === want
    ) || null
  );
}

let issueHighlightTimer = null;

function revealIssueOnBoardIfNeeded(issue) {
  const status = issue?.status;
  if (!status || prefs.enabledStatuses.includes(status)) return;
  prefs.enabledStatuses = [...prefs.enabledStatuses, status].sort((a, b) =>
    a.localeCompare(b)
  );
  writeStoredPrefs();
  renderStatusFilters();
  renderBoard();
}

function highlightIssueOnBoard(issueId) {
  board.querySelectorAll(".issue-highlight").forEach((el) => {
    el.classList.remove("issue-highlight");
  });
  const row = board.querySelector(`[data-issue-id="${CSS.escape(issueId)}"]`);
  if (!row) return false;
  row.classList.add("issue-highlight");
  row.scrollIntoView({ behavior: "smooth", block: "nearest" });
  clearTimeout(issueHighlightTimer);
  issueHighlightTimer = setTimeout(() => row.classList.remove("issue-highlight"), 3200);
  return true;
}

function setIssueLookupError(message) {
  const input = document.getElementById("issueLookupInput");
  const err = document.getElementById("issueLookupError");
  if (!input || !err) return;
  if (message) {
    err.textContent = message;
    err.hidden = false;
    input.classList.add("has-error");
    input.setAttribute("aria-invalid", "true");
  } else {
    err.textContent = "";
    err.hidden = true;
    input.classList.remove("has-error");
    input.removeAttribute("aria-invalid");
  }
}

async function openIssueByLookup(raw) {
  const q = String(raw ?? "").trim();
  if (!q) {
    setIssueLookupError("Enter a ticket ID");
    return;
  }
  setIssueLookupError("");
  const btn = document.getElementById("issueLookupBtn");
  const input = document.getElementById("issueLookupInput");
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
  }
  try {
    const onBoard = findIssueByIdentifier(q);
    if (onBoard) {
      revealIssueOnBoardIfNeeded(onBoard);
      highlightIssueOnBoard(onBoard.id);
      openDrawer(onBoard);
      return;
    }

    const res = await fetch(
      `/api/issues/lookup?identifier=${encodeURIComponent(q)}`
    );
    const data = await res.json();
    if (!res.ok) {
      const msg =
        data.message ||
        (res.status === 404 ? "Issue not found" : "Could not open issue");
      setIssueLookupError(msg);
      return;
    }
    const synced = findIssueById(data.id);
    if (synced) {
      revealIssueOnBoardIfNeeded(synced);
      highlightIssueOnBoard(synced.id);
      openDrawer(synced);
    } else {
      openDrawer(data);
    }
  } catch (err) {
    setIssueLookupError(err.message || "Could not open issue");
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML =
        '<i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i> Open';
    }
    input?.focus();
  }
}

function isIssueDone(issue) {
  return issue.statusType === "completed" || issue.status === "Done";
}

function renderMarkDoneButton(issue) {
  if (isIssueDone(issue)) return "";
  return `<button type="button" class="btn-mark-done" data-mark-done="${escapeHtml(issue.id)}" title="Set status to Done in Linear">
    <i class="fa-solid fa-check"></i> Mark done
  </button>`;
}

function renderIssueRow(issue, opts = {}) {
  const cls = opts.child ? "child-row" : "issue-row is-parent";
  const pill = statusClass(issue.statusType, issue.status);
  const labels = (issue.labels || []).slice(0, 3).join(" · ");
  const markDone = opts.child ? renderMarkDoneButton(issue) : "";
  return `<article class="${cls}" data-issue-id="${escapeHtml(issue.id)}" role="button" tabindex="0">
    <div>
      <div class="id-line">
        <span class="identifier">${escapeHtml(issue.identifier)}</span>
        <span class="status-pill ${pill}">${escapeHtml(issue.status)}</span>
        ${issue.priorityLabel && issue.priorityLabel !== "No priority" ? `<span class="sub-meta">${escapeHtml(issue.priorityLabel)}</span>` : ""}
      </div>
      <div class="title">${escapeHtml(issue.title)}</div>
      ${labels ? `<div class="sub-meta">${escapeHtml(labels)}</div>` : ""}
      ${opts.child ? renderChecklist(issue) : ""}
    </div>
    <div class="row-actions">${markDone}${issueLink(issue)}</div>
  </article>`;
}

function renderStatusFilters() {
  const names = [...statusCatalog.keys()].sort((a, b) => a.localeCompare(b));
  if (!names.length) {
    statusFilterBar.hidden = true;
    return;
  }
  statusFilterBar.hidden = false;
  statusChips.innerHTML = names
    .map((name) => {
      const on = prefs.enabledStatuses.includes(name);
      return `<button type="button" class="status-chip" data-status="${escapeHtml(name)}" aria-pressed="${on ? "true" : "false"}" title="Toggle ${escapeHtml(name)}">${escapeHtml(name)}</button>`;
    })
    .join("");
  const visible = collectAllIssues().filter(issuePassesStatusFilter).length;
  const total = collectAllIssues().length;
  statusFilterHint.textContent =
    visible === total ? `${total} issue${total === 1 ? "" : "s"}` : `Showing ${visible} of ${total}`;
  statusChips.querySelectorAll(".status-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const name = chip.getAttribute("data-status");
      const idx = prefs.enabledStatuses.indexOf(name);
      if (idx >= 0) {
        if (prefs.enabledStatuses.length <= 1) return;
        prefs.enabledStatuses = prefs.enabledStatuses.filter((s) => s !== name);
      } else {
        prefs.enabledStatuses = [...prefs.enabledStatuses, name].sort((a, b) => a.localeCompare(b));
      }
      writeStoredPrefs();
      renderStatusFilters();
      renderBoard();
    });
  });
}

function renderBoard() {
  const parts = [];
  const totalInData = countIssuesInData(state);
  for (const parent of state.parents || []) {
    const parentVisible = issuePassesStatusFilter(parent);
    const visibleKids = (parent.children || []).filter(issuePassesStatusFilter);
    if (!parentVisible && !visibleKids.length) continue;
    const kids = visibleKids.map((c) => renderIssueRow(c, { child: true })).join("");
    parts.push(`<section class="card">
      ${parentVisible ? renderIssueRow(parent) : ""}
      ${kids ? `<div class="children">${kids}</div>` : ""}
    </section>`);
  }
  const visibleStandalone = (state.standalone || []).filter(issuePassesStatusFilter);
  if (visibleStandalone.length) {
    parts.push(`<p class="section-label">Sub-issues (parent not in your list)</p>`);
    parts.push(
      `<section class="card">${visibleStandalone.map((i) => renderIssueRow(i, { child: true })).join("")}</section>`
    );
  }
  if (!parts.length) {
    parts.push(
      totalInData
        ? `<div class="card empty">No issues match the current filters. Try enabling more statuses above.</div>`
        : `<div class="card empty">No issues assigned to you on team BE.</div>`
    );
  }
  board.innerHTML = parts.join("");
  bindRows();
  bindChecklists();
  bindMarkDone();
}

function bindRows() {
  board.querySelectorAll("[data-issue-id]").forEach((el) => {
    const open = () => {
      const issue = findIssueById(el.getAttribute("data-issue-id"));
      if (issue) openDrawer(issue);
    };
    el.addEventListener("click", (e) => {
      if (e.target.closest("input, a, .btn-mark-done, .check-item, .checklist-modal-backdrop")) return;
      open();
    });
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });
  });
}

async function toggleChecklist(issueId, checklistIndex, checked, labelEl) {
  labelEl.classList.add("is-busy");
  try {
    const res = await fetch(`/api/issues/${issueId}/checklist`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ checklistIndex, checked }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || "Update failed");
    patchLocalIssue(issueId, body);
    if (prefs.hideCompletedChecklist) {
      renderBoard();
    } else {
      labelEl.classList.toggle("done", checked);
    }
  } catch (err) {
    alert(err.message || "Could not update Linear");
    const input = labelEl.querySelector("input");
    if (input) input.checked = !checked;
  } finally {
    labelEl.classList.remove("is-busy");
  }
}

function patchLocalIssue(issueId, payload) {
  const walk = (issue) => {
    if (issue.id === issueId) {
      issue.description = payload.description;
      issue.checklist = payload.checklist;
    }
  };
  state.parents.forEach((p) => {
    walk(p);
    (p.children || []).forEach(walk);
  });
  (state.standalone || []).forEach(walk);
}

function mergeIssueFields(target, source) {
  for (const key of [
    "status",
    "statusType",
    "title",
    "description",
    "checklist",
    "updatedAt",
    "priority",
    "priorityLabel",
    "labels",
    "assignee",
  ]) {
    if (key in source) target[key] = source[key];
  }
}

async function markIssueDone(issueId, btn) {
  btn.disabled = true;
  btn.classList.add("is-busy");
  const prevHtml = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const res = await fetch(`/api/issues/${issueId}/status`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "done" }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || "Update failed");
    const issue = findIssueById(issueId);
    if (issue) mergeIssueFields(issue, body);
    renderBoard();
    renderStatusFilters();
    if (drawerMode === "issue" && drawer.classList.contains("open") && findIssueById(issueId)) {
      openDrawer(findIssueById(issueId));
    }
  } catch (err) {
    alert(err.message || "Could not update Linear");
    btn.disabled = false;
    btn.innerHTML = prevHtml;
  } finally {
    btn.classList.remove("is-busy");
  }
}

function bindMarkDone() {
  board.querySelectorAll("[data-mark-done]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      markIssueDone(btn.getAttribute("data-mark-done"), btn);
    });
  });
}

async function copyChecklistText(rowEl, btn) {
  const textEl = rowEl.querySelector(".check-item-text");
  const text = textEl?.textContent?.trim() || "";
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add("is-copied");
    const icon = btn.querySelector("i");
    if (icon) {
      icon.className = "fa-solid fa-check";
      setTimeout(() => {
        btn.classList.remove("is-copied");
        icon.className = "fa-regular fa-copy";
      }, 1200);
    }
  } catch {
    alert("Could not copy to clipboard");
  }
}

function showChecklistDeleteConfirm(onConfirm) {
  const root = document.getElementById("checklistConfirmRoot");
  root.hidden = false;
  root.innerHTML = `
    <div class="checklist-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="checklistDeleteTitle">
      <div class="checklist-modal">
        <p id="checklistDeleteTitle">Are you sure you want to delete this item?</p>
        <div class="checklist-modal-actions">
          <button type="button" class="btn" data-checklist-cancel>Cancel</button>
          <button type="button" class="btn btn-danger" data-checklist-confirm>Delete</button>
        </div>
      </div>
    </div>`;
  const backdrop = root.querySelector(".checklist-modal-backdrop");
  const close = () => {
    root.hidden = true;
    root.innerHTML = "";
  };
  root.querySelector("[data-checklist-cancel]").addEventListener("click", (e) => {
    e.stopPropagation();
    close();
  });
  backdrop.addEventListener("click", (e) => {
    if (e.target === backdrop) close();
  });
  root.querySelector("[data-checklist-confirm]").addEventListener("click", (e) => {
    e.stopPropagation();
    close();
    onConfirm();
  });
}

async function deleteChecklistItem(issueId, checklistIndex, rowEl) {
  rowEl.classList.add("is-busy");
  try {
    const res = await fetch(`/api/issues/${issueId}/checklist`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ checklistIndex, delete: true }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || "Delete failed");
    patchLocalIssue(issueId, body);
    renderBoard();
  } catch (err) {
    alert(err.message || "Could not update Linear");
  } finally {
    rowEl.classList.remove("is-busy");
  }
}

function bindChecklists() {
  board.querySelectorAll(".check-item").forEach((row) => {
    const input = row.querySelector("input[type=checkbox]");
    if (input) {
      input.addEventListener("click", (e) => e.stopPropagation());
      input.addEventListener("change", (e) => {
        e.stopPropagation();
        const issueId = row.dataset.issue;
        const idx = Number(row.dataset.idx);
        toggleChecklist(issueId, idx, e.target.checked, row);
      });
    }
    row.querySelector("[data-check-copy]")?.addEventListener("click", (e) => {
      e.stopPropagation();
      copyChecklistText(row, e.currentTarget);
    });
    row.querySelector("[data-check-delete]")?.addEventListener("click", (e) => {
      e.stopPropagation();
      const issueId = row.dataset.issue;
      const idx = Number(row.dataset.idx);
      showChecklistDeleteConfirm(() => deleteChecklistItem(issueId, idx, row));
    });
    row.addEventListener("click", (e) => e.stopPropagation());
  });
}

function setPagesBtnPressed(on) {
  pagesBtn.setAttribute("aria-pressed", on ? "true" : "false");
}

function assigneePickerHtml(issue) {
  const label = issue.assignee?.name || "Unassigned";
  return `<div class="assignee-picker" data-assignee-picker data-issue-id="${escapeHtml(issue.id)}">
    <button type="button" class="assignee-trigger" aria-haspopup="listbox" aria-expanded="false">
      <span class="assignee-trigger-label">${escapeHtml(label)}</span>
      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
    <div class="assignee-menu" hidden role="listbox" aria-label="Assignee">
      <input type="search" class="pages-search assignee-search" placeholder="Search people…" autocomplete="off" />
      <ul class="assignee-options"></ul>
    </div>
  </div>`;
}

async function loadUsersList() {
  if (cachedUsersList) return cachedUsersList;
  const res = await fetch("/api/users");
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || "Failed to load users");
  cachedUsersList = data.users || [];
  return cachedUsersList;
}

function closeAssigneeMenus(except) {
  document.querySelectorAll("[data-assignee-picker]").forEach((picker) => {
    if (except && picker === except) return;
    const menu = picker.querySelector(".assignee-menu");
    const trigger = picker.querySelector(".assignee-trigger");
    if (menu) menu.hidden = true;
    if (trigger) trigger.classList.remove("is-open");
    if (trigger) trigger.setAttribute("aria-expanded", "false");
  });
}

function renderAssigneeOptions(picker, users, currentAssigneeId) {
  const list = picker.querySelector(".assignee-options");
  if (!list) return;
  const rows = [
    { id: null, name: "Unassigned", email: "" },
    ...users,
  ];
  list.innerHTML = rows
    .map((u) => {
      const selected =
        (u.id === null && !currentAssigneeId) || u.id === currentAssigneeId;
      const sub = u.email ? `<small>${escapeHtml(u.email)}</small>` : "";
      return `<li>
        <button type="button" class="assignee-option" role="option" data-user-id="${u.id === null ? "" : escapeHtml(u.id)}" aria-selected="${selected ? "true" : "false"}">
          ${escapeHtml(u.name)}${sub}
        </button>
      </li>`;
    })
    .join("");
}

function filterAssigneeOptions(picker, query) {
  const q = query.trim().toLowerCase();
  picker.querySelectorAll(".assignee-option").forEach((btn) => {
    const text = btn.textContent?.toLowerCase() || "";
    btn.closest("li").hidden = Boolean(q && !text.includes(q));
  });
}

async function setIssueAssignee(issueId, assigneeId, pickerEl) {
  pickerEl.classList.add("is-busy");
  closeAssigneeMenus();
  try {
    const res = await fetch(`/api/issues/${issueId}/assignee`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ assigneeId }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || "Update failed");
    const issue = findIssueById(issueId);
    if (issue) mergeIssueFields(issue, body);
    renderBoard();
    if (drawerMode === "issue" && openDrawerIssueId === issueId) {
      const refreshed = findIssueById(issueId);
      if (refreshed) openDrawer(refreshed);
    }
  } catch (err) {
    alert(err.message || "Could not update Linear");
  } finally {
    pickerEl.classList.remove("is-busy");
  }
}

function bindAssigneePicker(picker, issue) {
  const trigger = picker.querySelector(".assignee-trigger");
  const menu = picker.querySelector(".assignee-menu");
  const search = picker.querySelector(".assignee-search");
  const list = picker.querySelector(".assignee-options");
  if (!trigger || !menu || !list) return;

  let usersLoaded = false;

  const openMenu = async () => {
    closeAssigneeMenus(picker);
    menu.hidden = false;
    trigger.classList.add("is-open");
    trigger.setAttribute("aria-expanded", "true");
    try {
      if (!usersLoaded) {
        list.innerHTML = '<li><span class="pages-hint" style="padding:10px 14px;margin:0"><span class="spinner"></span> Loading…</span></li>';
        const users = await loadUsersList();
        renderAssigneeOptions(picker, users, issue.assignee?.id ?? null);
        usersLoaded = true;
      }
      filterAssigneeOptions(picker, search?.value || "");
      search?.focus();
    } catch (err) {
      menu.querySelector(".assignee-options").innerHTML =
        `<li><span class="pages-hint" style="padding:10px 14px;margin:0;color:#b33">${escapeHtml(err.message)}</span></li>`;
    }
  };

  trigger.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!menu.hidden) {
      closeAssigneeMenus();
      return;
    }
    openMenu();
  });

  search?.addEventListener("input", () => filterAssigneeOptions(picker, search.value));
  search?.addEventListener("click", (e) => e.stopPropagation());

  menu.addEventListener("click", (e) => {
    e.stopPropagation();
    const btn = e.target.closest(".assignee-option");
    if (!btn || btn.closest("li")?.hidden) return;
    const raw = btn.getAttribute("data-user-id");
    const assigneeId = raw ? raw : null;
    const current = issue.assignee?.id ?? null;
    if (assigneeId === current) {
      closeAssigneeMenus();
      return;
    }
    setIssueAssignee(issue.id, assigneeId, picker);
  });

  picker.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.stopPropagation();
      closeAssigneeMenus();
    }
  });
}

document.addEventListener("click", (e) => {
  if (!e.target.closest("[data-assignee-picker]")) closeAssigneeMenus();
});

function renderPagesDrawerBody(pages) {
  if (!pages.length) {
    drawerBody.innerHTML = `
      <p class="pages-hint">No prototype HTML files found in the repo root.</p>
      <button type="button" class="btn" id="pagesRetryBtn">Refresh list</button>
    `;
    document.getElementById("pagesRetryBtn")?.addEventListener("click", () => {
      cachedPagesList = null;
      reloadPagesDrawer();
    });
    return;
  }
  const base = appConfig.localPrototypeBase?.replace(/\/$/, "");
  const rows = pages
    .map((p) => {
      const href = base ? localPrototypeUrl(p.path) : "#";
      const note = p.isDashboard ? ' <small>(dashboard)</small>' : "";
      const disabled = !base ? ' aria-disabled="true"' : "";
      return `<li data-page-label="${escapeHtml(p.label.toLowerCase())}">
        <a class="page-link" href="${escapeHtml(href)}" target="_blank" rel="noopener"${disabled}>
          <span>${escapeHtml(p.label)}${note}</span>
          <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
        </a>
      </li>`;
    })
    .join("");
  drawerBody.innerHTML = `
    <p class="pages-hint">Opens on <code>${escapeHtml(base)}</code> (<code>serve</code>, clean paths like <code>/vetting</code>). <code>npm run dashboard</code> starts that server if it is not already running.</p>
    <input type="search" class="pages-search" id="pagesSearch" placeholder="Filter pages…" autocomplete="off" />
    <ul class="page-list" id="pagesList">${rows}</ul>
  `;
  const search = document.getElementById("pagesSearch");
  const list = document.getElementById("pagesList");
  search?.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    list.querySelectorAll("li").forEach((li) => {
      const label = li.dataset.pageLabel || "";
      li.hidden = Boolean(q && !label.includes(q));
    });
  });
}

async function togglePagesDrawer() {
  if (drawerMode === "pages" && drawer.classList.contains("open")) {
    closeDrawer();
    return;
  }
  drawerMode = "pages";
  openDrawerIssueId = null;
  setPagesBtnPressed(true);
  drawer.setAttribute("aria-label", "Prototype pages");
  drawerTitle.textContent = "Prototype pages";
  drawerBody.innerHTML = '<p class="pages-hint"><span class="spinner"></span> Loading pages…</p>';
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  try {
    await ensureAppConfig();
    renderPagesDrawerBody(await fetchPagesList());
  } catch (err) {
    showPagesDrawerError(err);
  }
}

function openDrawer(issue) {
  drawerMode = "issue";
  setPagesBtnPressed(false);
  drawer.setAttribute("aria-label", "Issue details");
  openDrawerIssueId = issue.id;
  drawerTitle.textContent = `${issue.identifier} · ${issue.title}`;
  const parentLine = issue.parentIdentifier
    ? `<div><dt>Parent</dt><dd><a href="#" onclick="return false">${escapeHtml(issue.parentIdentifier)}</a> ${escapeHtml(issue.parentTitle || "")}</dd></div>`
    : "";
  const labelHtml = (issue.labels || []).map((l) => `<span class="label-chip">${escapeHtml(l)}</span>`).join("") || "—";
  drawerBody.innerHTML = `
    <dl class="drawer-kv">
      <div><dt>Status</dt><dd>${escapeHtml(issue.status)}</dd></div>
      <div><dt>Assignee</dt><dd>${assigneePickerHtml(issue)}</dd></div>
      <div><dt>Priority</dt><dd>${escapeHtml(issue.priorityLabel || "—")}</dd></div>
      <div><dt>Labels</dt><dd>${labelHtml}</dd></div>
      ${parentLine}
      <div><dt>Linear</dt><dd><a href="${escapeHtml(issue.url)}" target="_blank" rel="noopener">Open ticket</a></dd></div>
    </dl>
    ${renderMarkdown(issue.description)}
  `;
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  const picker = drawerBody.querySelector("[data-assignee-picker]");
  if (picker) bindAssigneePicker(picker, issue);
}

function closeDrawer() {
  closeAssigneeMenus();
  openDrawerIssueId = null;
  drawerMode = null;
  setPagesBtnPressed(false);
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
}

document.getElementById("drawerClose").addEventListener("click", closeDrawer);
pagesBtn.addEventListener("click", togglePagesDrawer);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const tag = document.activeElement?.tagName;
    const editable = document.activeElement?.isContentEditable;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || editable) return;
    e.preventDefault();
    document.getElementById("issueLookupInput")?.focus();
    return;
  }
  if (e.key !== "Escape") return;
  const confirmRoot = document.getElementById("checklistConfirmRoot");
  if (confirmRoot && !confirmRoot.hidden) {
    confirmRoot.hidden = true;
    confirmRoot.innerHTML = "";
    return;
  }
  closeDrawer();
});

const issueLookupForm = document.getElementById("issueLookupForm");
const issueLookupInput = document.getElementById("issueLookupInput");
issueLookupForm?.addEventListener("submit", (e) => {
  e.preventDefault();
  openIssueByLookup(issueLookupInput?.value);
});
issueLookupInput?.addEventListener("input", () => {
  if (issueLookupInput.classList.contains("has-error")) setIssueLookupError("");
});

function showSetup(message) {
  setupBanner.hidden = false;
  setupBanner.className = "banner error";
  setupBanner.innerHTML = message;
  metaRow.hidden = true;
  board.innerHTML = "";
}

async function loadConfig() {
  const res = await fetch("/api/config");
  return res.json();
}

async function ensureAppConfig() {
  if (appConfig.localPrototypeBase) return appConfig;
  const cfg = await loadConfig();
  appConfig = {
    localPrototypeBase: cfg.localPrototypeBase ?? "",
    githubPagesBase: cfg.githubPagesBase || appConfig.githubPagesBase,
  };
  return appConfig;
}

async function fetchPagesList({ force = false } = {}) {
  if (!force && cachedPagesList !== null) return cachedPagesList;
  const res = await fetch("/api/pages", { cache: "no-store" });
  let data;
  try {
    data = await res.json();
  } catch {
    throw new Error(
      "Could not read /api/pages. Open http://localhost:3001/dashboard.html (npm run dashboard), not the static dev server."
    );
  }
  if (!res.ok) {
    const hint =
      res.status === 404
        ? " Restart npm run dashboard so /api/pages is registered, then hard-refresh."
        : "";
    throw new Error((data.message || "Failed to load pages") + hint);
  }
  if (!Array.isArray(data.pages)) {
    throw new Error("Pages API returned an unexpected response");
  }
  cachedPagesList = data.pages;
  return cachedPagesList;
}

function showPagesDrawerError(err) {
  const msg = err?.message || "Failed to load pages";
  drawerBody.innerHTML = `
    <p class="pages-hint" style="color:#b33">${escapeHtml(msg)}</p>
    <p class="pages-hint">Use <code>http://localhost:3001/dashboard.html</code> with <code>npm run dashboard</code> running.</p>
    <button type="button" class="btn" id="pagesRetryBtn">Try again</button>
  `;
  document.getElementById("pagesRetryBtn")?.addEventListener("click", () => {
    cachedPagesList = null;
    reloadPagesDrawer();
  });
}

async function reloadPagesDrawer() {
  drawerBody.innerHTML =
    '<p class="pages-hint"><span class="spinner"></span> Loading pages…</p>';
  try {
    await ensureAppConfig();
    renderPagesDrawerBody(await fetchPagesList({ force: true }));
  } catch (err) {
    showPagesDrawerError(err);
  }
}

async function loadDashboard() {
  refreshBtn.disabled = true;
  refreshBtn.innerHTML = '<span class="spinner"></span> Loading…';
  try {
    const res = await fetch("/api/dashboard");
    const data = await res.json();
    if (res.status === 503 && data.error === "missing_api_key") {
      showSetup(
        `<strong>Linear API key required.</strong><br>
        1. Copy <code>.env.example</code> to <code>.env</code> in the repo root.<br>
        2. Add your personal API key from <a href="https://linear.app/settings/api" target="_blank" rel="noopener">Linear settings</a>.<br>
        3. Restart with <code>npm run dashboard</code> and reload this page.`
      );
      return;
    }
    if (!res.ok) throw new Error(data.message || "Failed to load dashboard");
    setupBanner.hidden = true;
    metaRow.hidden = false;
    state = data;
    viewerName.textContent = data.viewer?.name || "You";
    document.getElementById("viewerLabel").textContent = data.viewer?.email || "BetterEngineer";
    fetchedAt.textContent = data.fetchedAt
      ? `Updated ${new Date(data.fetchedAt).toLocaleString()}`
      : "";
    statusCatalog = buildStatusCatalog(data);
    syncEnabledStatusesWithCatalog();
    writeStoredPrefs();
    renderStatusFilters();
    renderBoard();
  } catch (err) {
    showSetup(`<strong>Could not load issues.</strong> ${escapeHtml(err.message)}`);
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Refresh';
  }
}

hideChecklistDoneBtn.addEventListener("click", () => {
  prefs.hideCompletedChecklist = !prefs.hideCompletedChecklist;
  hideChecklistDoneBtn.setAttribute("aria-pressed", prefs.hideCompletedChecklist ? "true" : "false");
  writeStoredPrefs();
  renderBoard();
});

refreshBtn.addEventListener("click", loadDashboard);
applyPrefsFromStorage();
loadConfig()
  .then(async (cfg) => {
    appConfig = {
      localPrototypeBase: cfg.localPrototypeBase ?? "",
      githubPagesBase: cfg.githubPagesBase || appConfig.githubPagesBase,
    };
    fetchPagesList().catch(() => {});
    if (!cfg.hasApiKey) {
      showSetup(
        `<strong>LINEAR_API_KEY not configured.</strong> Copy <code>.env.example</code> → <code>.env</code>, add your key from <a href="https://linear.app/settings/api" target="_blank" rel="noopener">Linear API settings</a>, save, restart <code>npm run dashboard</code>, and reload.`
      );
    } else {
      loadDashboard();
    }
  })
  .catch(() => {
    showSetup(
      `<strong>Dashboard API unreachable.</strong> Run <code>npm run dashboard</code> and open <code>http://localhost:3001/dashboard.html</code> (not <code>npm run dev</code> alone).`
    );
  });
</script>
</body>
</html>
