<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>BetterEngineer · Schedule · Gabriel Kouyoumdjian</title>
<link rel="stylesheet" href="https://use.typekit.net/lhs7vwi.css">
<style>
:root {
  --blue: #4c60b2;
  --blue-deep: #3c4d96;
  --ink: #1c1c1c;
  --muted: #6d6d6d;
  --faint: #8a8a8a;
  --line: #e7e7e7;
  --soft: #f6f6f7;
  --green: #2f8f45;
  --font: "runda", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: #fff;
  -webkit-font-smoothing: antialiased;
}
b, strong { font-weight: 500; }
button, input, textarea { font-family: inherit; font-size: 15px; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
p, h1, h2 { margin: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr);
  min-height: 0;
}

.summary {
  background: var(--soft);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 28px 28px 20px;
}
.logo { width: 132px; height: auto; margin: 0 0 36px; }
.who { display: flex; gap: 14px; align-items: flex-start; }
.who img {
  width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex: 0 0 52px;
}
.eyebrow { font-size: 13px; color: var(--faint); line-height: 1.3; }
.who h1 { margin-top: 2px; font-size: 20px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; }
.who .meta { margin-top: 4px; font-size: 14px; color: var(--muted); line-height: 1.35; }
.intro { margin-top: 20px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.status { display: none; margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.sum-body { flex: 1; min-height: 0; overflow: auto; margin-top: 8px; }
.block { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e4e4e4; }
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.block-h h2 { font-size: 13px; font-weight: 500; color: var(--muted); }
.edit {
  border: 0; background: none; padding: 0;
  font-size: 13px; color: var(--blue);
}
.edit:hover { color: var(--blue-deep); }
.sum-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 5px 0; font-size: 14px; line-height: 1.35; color: var(--ink);
}
.sum-item span { min-width: 0; }
.x {
  width: 28px; height: 28px; flex: 0 0 28px;
  border: 0; background: transparent; color: var(--faint);
  border-radius: 6px; display: grid; place-items: center; padding: 0;
}
.x:hover { background: #ececee; color: var(--ink); }
.cancel {
  margin-top: 16px; align-self: flex-start;
  border: 0; background: none; padding: 8px 0;
  font-size: 14px; color: var(--muted);
}
.cancel:hover { color: var(--ink); }

.work {
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0; background: #fff;
}
.meter {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  padding: 22px 56px 0;
  max-width: 932px;
}
.meter button {
  position: relative;
  height: 18px; border: 0; background: transparent; padding: 0;
}
.meter button::before {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 3px; border-radius: 99px; background: #e6e6e8;
}
.meter button.is-on::before,
.meter button.is-done::before { background: var(--blue); }
.meter button:disabled { cursor: default; }

.stage-scroll {
  flex: 1; min-height: 0; overflow: auto;
  display: flex; flex-direction: column;
  padding: 28px 56px 40px;
}
.stage { width: 100%; max-width: 820px; }
.stage.is-focus { margin-block: auto; padding-bottom: 6vh; }
.kicker { font-size: 13px; color: var(--faint); margin: 0 0 8px; }
.title-row {
  display: flex; align-items: baseline; justify-content: flex-start; flex-wrap: wrap; gap: 12px;
}
.stage h2 {
  font-size: 26px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.2; color: var(--ink);
}
.lede { margin-top: 8px; max-width: 68ch; font-size: 15px; line-height: 1.5; color: var(--muted); }
.count { flex: 0 0 auto; padding-bottom: 3px; font-size: 14px; color: var(--muted); }
.count.is-ready { color: var(--green); }

.lengths {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 28px;
  max-width: 560px;
}
.len {
  display: flex; align-items: flex-start; gap: 14px;
  min-height: 92px; padding: 18px;
  border: 1px solid #e4e4e4; border-radius: 12px;
  background: #fff; text-align: left;
}
.len:hover { border-color: #c9cde0; background: #fafbfe; }
.len.is-on { border-color: var(--blue); background: #f5f7fc; box-shadow: inset 0 0 0 1px var(--blue); }
.radio {
  width: 18px; height: 18px; margin-top: 2px; flex: 0 0 18px;
  border: 1.5px solid #c8c8c8; border-radius: 50%;
  display: grid; place-items: center;
}
.len.is-on .radio { border-color: var(--blue); }
.len.is-on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.len b { display: block; font-size: 18px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; }
.len small { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); line-height: 1.3; }

.when {
  display: grid;
  grid-template-columns: 308px minmax(240px, 1fr);
  gap: 48px;
  align-items: start;
  margin-top: 28px;
}
.cal-head, .day-label {
  height: 40px; margin: 0 0 8px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
}
.day-label.is-empty { color: var(--faint); font-weight: 400; }
.cal-nav { display: flex; gap: 2px; }
.cal-nav button {
  width: 32px; height: 32px; border: 0; background: transparent;
  border-radius: 8px; color: #555; display: grid; place-items: center; padding: 0;
}
.cal-nav button:hover { background: #f2f2f4; color: var(--ink); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 40px);
  column-gap: 4px;
  row-gap: 8px;
}
.dow {
  height: 28px; display: grid; place-items: center;
  font-size: 12px; letter-spacing: 0.04em; color: var(--faint); font-weight: 500;
}
.day {
  position: relative;
  width: 40px; height: 40px; border: 0; background: transparent;
  border-radius: 50%; font-size: 14px; color: var(--ink); padding: 0;
}
.day:hover:not(:disabled) { background: #f2f3f8; }
.day.is-out { color: #c8c8c8; }
.day.is-open { color: var(--blue); font-weight: 500; }
.day.is-today:not(.is-on) { box-shadow: inset 0 0 0 1.5px var(--blue); }
.day.is-on, .day.is-on:hover { background: var(--blue); color: #fff; font-weight: 500; }
.day:disabled { color: #d5d5d5; cursor: default; }
.tz { position: relative; margin-top: 18px; }
.tz-btn {
  width: 100%; height: 40px; padding: 0 12px;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid #e4e4e4; border-radius: 10px; background: #fff;
  font-size: 14px; text-align: left;
}
.tz-btn:hover { border-color: #d0d0d0; }
.tz-btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tz .menu { top: auto; bottom: calc(100% + 6px); }

.slots {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  align-content: start;
  max-height: min(520px, calc(100dvh - 300px));
  overflow: auto;
  padding-right: 4px;
}
.slot {
  height: 40px; padding: 0 12px;
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid #e4e4e4; border-radius: 10px; background: #fff;
  font-size: 14px; color: var(--ink);
}
.slot.is-open { border-color: var(--blue); color: #243056; }
.slot:hover { background: #f7f8fb; }
.slot.is-on, .slot.is-on:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.slot .tick { width: 14px; height: 14px; }
.pick-empty {
  min-height: 160px; display: flex; align-items: center;
  font-size: 14px; line-height: 1.45; color: var(--faint);
}

.narrow { max-width: 480px; }
.finder { position: relative; display: block; margin-top: 24px; }
.finder input {
  width: 100%; height: 44px; padding: 0 14px 0 40px;
  border: 1px solid #e4e4e4; border-radius: 10px; background: #fff;
}
.finder input::placeholder { color: #b0b0b0; }
.finder input:focus { outline: 2px solid #d5dbed; border-color: #c5cde4; }
.finder .mag { position: absolute; left: 14px; top: 14px; color: var(--faint); pointer-events: none; }
.people { margin-top: 8px; }
.person {
  width: 100%;
  display: grid; grid-template-columns: 36px minmax(0, 1fr) 18px;
  gap: 12px; align-items: center;
  padding: 10px 8px; border: 0; border-radius: 10px; background: transparent; text-align: left;
}
.person:hover { background: #f6f6f8; }
.person.is-on { background: #f4f6fc; }
.ava {
  width: 36px; height: 36px; border-radius: 10px; color: #fff;
  display: grid; place-items: center; font-size: 12px; font-weight: 500;
}
.person b { display: block; font-size: 15px; font-weight: 500; line-height: 1.3; }
.person small {
  display: block; margin-top: 1px; font-size: 13px; color: var(--faint); line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.person .tick { color: var(--blue); }
.add-row b { color: var(--blue); }
.empty-people { padding: 24px 8px; font-size: 14px; color: var(--muted); }

.field { margin-top: 24px; }
.lbl { display: block; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
.pop { position: relative; }
.pop:has(.menu) { z-index: 30; }
.select {
  width: 100%; height: 44px; padding: 0 12px;
  display: flex; align-items: center; gap: 10px;
  border: 1px solid #e4e4e4; border-radius: 10px; background: #fff; text-align: left;
}
.select:hover { border-color: #d0d0d0; }
.select .lead { color: var(--blue); flex: 0 0 auto; }
.select .chev { margin-left: auto; color: var(--faint); }
.menu {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 30;
  min-width: 100%; padding: 6px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(20, 20, 20, 0.12);
}
.menu button {
  display: block; width: 100%; text-align: left;
  border: 0; background: transparent; border-radius: 8px;
  padding: 8px 10px; font-size: 14px;
}
.menu button:hover, .menu button.is-on { background: #f4f6fc; }
.menu button.is-on { color: var(--blue); }
.check {
  display: flex; align-items: flex-start; gap: 12px;
  margin-top: 8px; font-size: 15px; line-height: 1.4; cursor: pointer;
}
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--blue); flex: 0 0 auto; }
.notes {
  width: 100%; min-height: 120px; resize: vertical;
  padding: 12px 14px; border: 1px solid #e4e4e4; border-radius: 10px;
  line-height: 1.5; background: #fff;
}
.notes::placeholder { color: #b0b0b0; }
.notes:focus { outline: 2px solid #d5dbed; border-color: #c5cde4; }

.sent { max-width: 460px; }
.sent-mark {
  width: 48px; height: 48px; margin-bottom: 20px;
  border-radius: 50%; background: #e7f6eb; color: var(--green);
  display: grid; place-items: center;
}
.sent-mark svg { width: 22px; height: 22px; }
.sent h2 { font-size: 32px; letter-spacing: -0.03em; }
.sent p { margin-top: 10px; font-size: 15px; line-height: 1.55; color: #3f3f3f; }
.sent ul { margin: 18px 0 0; padding: 0; list-style: none; }
.sent li { position: relative; padding: 6px 0 6px 16px; font-size: 15px; }
.sent li::before {
  content: ""; position: absolute; left: 0; top: 13px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--blue);
}
.sent .fine { margin-top: 16px; font-size: 13px; color: var(--faint); }

.dock {
  flex: 0 0 auto;
  height: 76px;
  display: flex; align-items: center; gap: 16px;
  padding: 0 56px;
  border-top: 1px solid var(--line);
  background: #fff;
}
.hint { flex: 1; margin: 0; font-size: 14px; color: var(--muted); }
.btn-back, .btn-next {
  height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 500;
}
.btn-back { border: 0; background: transparent; color: var(--ink); }
.btn-back:hover { background: #f3f3f5; }
.btn-next {
  margin-left: auto; min-width: 132px;
  border: 0; background: var(--blue); color: #fff;
}
.btn-next:hover { background: var(--blue-deep); }
.btn-next:disabled { background: #ececef; color: #9a9a9a; cursor: not-allowed; }

.slots::-webkit-scrollbar, .sum-body::-webkit-scrollbar, .stage-scroll::-webkit-scrollbar { width: 8px; }
.slots::-webkit-scrollbar-thumb, .sum-body::-webkit-scrollbar-thumb, .stage-scroll::-webkit-scrollbar-thumb {
  background: #ddd; border-radius: 99px;
}

@media (max-width: 980px) {
  .when { grid-template-columns: 1fr; gap: 28px; }
  .slots { max-height: none; overflow: visible; }
  .meter, .stage-scroll, .dock { padding-left: 28px; padding-right: 28px; }
}
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .summary { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 20px 14px; }
  .logo { width: 118px; margin-bottom: 16px; }
  .intro, .sum-body { display: none; }
  .status { display: block; }
  .cancel { display: block; margin: 10px 0 0; padding: 0; }
  .who img { width: 44px; height: 44px; flex-basis: 44px; }
  .meter, .stage-scroll, .dock { padding-left: 20px; padding-right: 20px; }
  .stage-scroll { padding-top: 20px; padding-bottom: 24px; }
  .stage.is-focus { margin-block: 0; padding-bottom: 0; }
  .stage h2 { font-size: 24px; }
  .dock { height: 68px; }
  .hint { font-size: 13px; }
  .btn-next { min-width: 108px; }
  .lengths { grid-template-columns: 1fr; max-width: none; gap: 8px; margin-top: 20px; }
  .len { min-height: 0; padding: 14px 16px; }
}
@media (max-width: 520px) {
  .slots { grid-template-columns: 1fr; }
  .who h1 { font-size: 18px; }
}
</style>

function hm(h, m = 0) { return h * 60 + m; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pad(n) { return String(n).padStart(2, "0"); }
function keyOf(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function parseKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MON_S = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function dayName(key) {
  const dt = parseKey(key);
  return `${WD[dt.getDay()]}, ${MON_S[dt.getMonth()]} ${dt.getDate()}`;
}
function clock(mins) {
  let h = Math.floor(mins / 60);
  const m = mins % 60;
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return { h, m, ap, text: `${h}:${pad(m)} ${ap}` };
}
function rangeLabel(start, dur) {
  const a = clock(start);
  const b = clock(start + dur);
  if (a.ap === b.ap) return `${a.h}:${pad(a.m)}–${b.h}:${pad(b.m)} ${a.ap}`;
  return `${a.text}–${b.text}`;
}
function lengthMeta() { return LENGTHS.find((l) => l.min === state.duration); }
function directory() { return PEOPLE.concat(state.extras); }
function selectedPeople() { return directory().filter((p) => state.selected.has(p.id)); }
function zoneLabel() { return (ZONES.find((z) => z.id === state.tz) || ZONES[0]).label; }
function confLabel() { return (CONFS.find((c) => c.id === state.conference) || CONFS[0]).label; }
function starts() {
  const dur = state.duration || 60;
  const list = [];
  for (let t = hm(7, 30); t + dur <= hm(18); t += 15) list.push(t);
  return list;
}
function openStarts(date) {
  const dur = state.duration || 60;
  return (OPEN[date] || []).filter((t) => t >= hm(7, 30) && t + dur <= hm(18));
}
function dayIsOpen(date) { return openStarts(date).length > 0; }
function hasSlot(date, start) { return state.slots.some((s) => s.date === date && s.start === start); }
function isEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
function kicker() {
  if (state.step >= 4) return "";
  return `<p class="kicker">Step ${state.step + 1} of 4</p>`;
}

function canAdvance() {
  if (state.step === 0) return !!state.duration;
  if (state.step === 1) return state.slots.length >= 3;
  if (state.step === 2) return state.selected.size >= 1;
  if (state.step === 3) return !!state.conference && !state.sending;
  return false;
}
function hintText() {
  if (state.step === 0 && !state.duration) return "Choose a length to continue";
  if (state.step === 1 && state.slots.length < 3) {
    const left = 3 - state.slots.length;
    if (left === 3) return "Add at least 3 times";
    return `Add ${left} more time${left === 1 ? "" : "s"}`;
  }
  if (state.step === 2 && state.selected.size < 1) return "Add at least one person";
  if (state.sending) return "Sending invite…";
  return "";
}

function leave() {
  const ref = document.referrer || "";
  if (ref.startsWith(location.origin) && !ref.includes("schedule.html")) {
    location.href = ref;
    return;
  }
  location.href = "vetting.html";
}

function toggleSlot(date, start) {
  const i = state.slots.findIndex((s) => s.date === date && s.start === start);
  if (i >= 0) state.slots.splice(i, 1);
  else state.slots.push({ date, start });
  state.slots.sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start);
}

function filteredPeople() {
  const q = state.query.trim().toLowerCase();
  return directory().filter((p) => !q || p.name.toLowerCase().includes(q) || p.email.toLowerCase().includes(q) || p.role.toLowerCase().includes(q));
}

function addEmail(raw) {
  const email = raw.trim().toLowerCase();
  if (!isEmail(email)) return;
  const existing = directory().find((p) => p.email.toLowerCase() === email);
  if (existing) {
    state.selected.add(existing.id);
  } else {
    const id = "extra-" + (state.extras.length + 1);
    const local = email.split("@")[0];
    state.extras.push({
      id, name: email, email,
      initials: local.slice(0, 2).toUpperCase(),
      color: "#5b4bb7",
      role: "Guest"
    });
    state.selected.add(id);
  }
  state.query = "";
}

function paintProgress() {
  const html = STEPS.map((label, i) => {
    const done = state.step === 4 || i < state.step;
    const on = state.step !== 4 && i === state.step;
    const cls = on ? "is-on" : done ? "is-done" : "";
    const disabled = state.step === 4 || i > state.step;
    const status = done ? "completed" : on ? "current" : "upcoming";
    return `<button type="button" class="${cls}" data-act="goto" data-step="${i}" aria-label="${label}, ${status}" ${disabled ? "disabled" : ""}></button>`;
  }).join("");
  document.getElementById("progress").innerHTML = html;
}

function statusLine() {
  const len = lengthMeta();
  const bits = [];
  if (len) bits.push(len.summary);
  if (state.slots.length) bits.push(`${state.slots.length} ${state.slots.length === 1 ? "time" : "times"}`);
  if (state.seenPeople) bits.push(`${selectedPeople().length} invited`);
  return bits.join(" · ");
}

function block(title, step, inner) {
  const edit = state.step === 4 ? "" : `<button type="button" class="edit" data-act="goto" data-step="${step}">Edit</button>`;
  return `<section class="block"><div class="block-h"><h2>${title}</h2>${edit}</div>${inner}</section>`;
}

function paintSummary() {
  const len = lengthMeta();
  let blocks = "";
  if (len) blocks += block("Length", 0, `<div class="sum-item"><span>${esc(len.summary)}</span></div>`);
  if (state.slots.length) {
    const items = state.slots.map((s) => {
      const label = `${dayName(s.date)}, ${rangeLabel(s.start, state.duration || 60)}`;
      const remove = state.step === 4 ? "" : `<button type="button" class="x" data-act="unslot" data-date="${s.date}" data-start="${s.start}" aria-label="Remove ${esc(label)}">${ICO.x}</button>`;
      return `<div class="sum-item"><span>${esc(label)}</span>${remove}</div>`;
    }).join("");
    blocks += block("Times", 1, items);
  }
  if (state.seenPeople) {
    const people = selectedPeople();
    const items = people.map((p) => {
      const name = p.name === p.email ? p.email : p.name;
      const remove = state.step === 4 ? "" : `<button type="button" class="x" data-act="unperson" data-id="${esc(p.id)}" aria-label="Remove ${esc(name)}">${ICO.x}</button>`;
      return `<div class="sum-item"><span title="${esc(p.email)}">${esc(name)}</span>${remove}</div>`;
    }).join("");
    blocks += block(`People · ${people.length}`, 2, items);
  }
  const cancel = state.step === 4 ? "" : `<button type="button" class="cancel" data-act="leave">Cancel</button>`;
  document.getElementById("summary").innerHTML = `
    <img class="logo" src="assets/logo.svg" alt="BetterEngineer">
    <div class="who">
      <img src="assets/gabriel.png" alt="">
      <div>
        <p class="eyebrow">Interview with</p>
        <h1>Gabriel Kouyoumdjian</h1>
        <p class="meta">Technical Architect<br>DAC Consulting</p>
      </div>
    </div>
    <p class="intro">Gabriel gets the times you suggest and picks one.</p>
    <p class="status">${esc(statusLine())}</p>
    <div class="sum-body">${blocks}</div>
    ${cancel}`;
}

function calendarHTML() {
  const { y, m } = state.month;
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) {
    const d = prevDays - first + 1 + i;
    const dt = new Date(y, m - 1, d);
    cells.push({ y: dt.getFullYear(), m: dt.getMonth(), d: dt.getDate(), out: true });
  }
  for (let d = 1; d <= days; d++) cells.push({ y, m, d, out: false });
  let n = 1;
  while (cells.length % 7) {
    const dt = new Date(y, m + 1, n++);
    cells.push({ y: dt.getFullYear(), m: dt.getMonth(), d: dt.getDate(), out: true });
  }
  const dow = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"].map((d) => `<span class="dow">${d}</span>`).join("");
  const daysHtml = cells.map((cell) => {
    const key = keyOf(cell.y, cell.m, cell.d);
    const past = key < TODAY;
    const open = !past && dayIsOpen(key);
    const on = state.cursor === key;
    const cls = [cell.out ? "is-out" : "", open ? "is-open" : "", on ? "is-on" : "", key === TODAY ? "is-today" : ""].filter(Boolean).join(" ");
    const long = parseKey(key).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    const status = past ? "unavailable" : on ? "selected" : open ? "Gabriel is free" : "";
    if (past) return `<button type="button" class="day ${cls}" disabled aria-label="${esc(long)}, unavailable">${cell.d}</button>`;
    return `<button type="button" class="day ${cls}" data-act="day" data-date="${key}" aria-pressed="${on}" aria-label="${esc(long)}${status ? ", " + status : ""}">${cell.d}</button>`;
  }).join("");
  const zoneButtons = ZONES.map((z) => `<button type="button" data-act="tz" data-id="${z.id}" class="${z.id === state.tz ? "is-on" : ""}">${esc(z.label)}</button>`).join("");
  return `
    <div class="cal-head">
      <span>${MON[m]} ${y}</span>
      <div class="cal-nav">
        <button type="button" data-act="month" data-dir="-1" aria-label="Previous month">${ICO.left}</button>
        <button type="button" data-act="month" data-dir="1" aria-label="Next month">${ICO.right}</button>
      </div>
    </div>
    <div class="cal-grid" role="group" aria-label="${MON[m]} ${y}">${dow}${daysHtml}</div>
    <div class="tz pop">
      <button type="button" class="tz-btn" data-act="tz-open" aria-expanded="${state.tzOpen}" aria-haspopup="listbox">
        ${ICO.globe}<span>${esc(zoneLabel())}</span>
      </button>
      ${state.tzOpen ? `<div class="menu" role="listbox">${zoneButtons}</div>` : ""}
    </div>`;
}

function slotsHTML() {
  if (!state.cursor) {
    return `<div class="day-label is-empty">Times</div><div class="pick-empty">Select a date to see times.</div>`;
  }
  const open = new Set(openStarts(state.cursor));
  const buttons = starts().map((t) => {
    const on = hasSlot(state.cursor, t);
    const cls = [open.has(t) ? "is-open" : "", on ? "is-on" : ""].filter(Boolean).join(" ");
    return `<button type="button" class="slot ${cls}" data-act="slot" data-date="${state.cursor}" data-start="${t}" aria-pressed="${on}"><span>${clock(t).text}</span>${on ? ICO.check : ""}</button>`;
  }).join("");
  return `<div class="day-label">${esc(dayName(state.cursor))}</div><div class="slots">${buttons}</div>`;
}

function peopleHTML() {
  const q = state.query.trim();
  const list = filteredPeople();
  const canAdd = isEmail(q) && !directory().some((p) => p.email.toLowerCase() === q.toLowerCase());
  const add = canAdd ? `<button type="button" class="person add-row" data-act="add-email"><span class="ava" style="background:#4c60b2">+</span><span><b>Invite ${esc(q)}</b><small>Add this address</small></span><span></span></button>` : "";
  if (!list.length && !canAdd) return `<div class="empty-people">No one matches that search.</div>`;
  const rows = list.map((p) => {
    const on = state.selected.has(p.id);
    const sub = p.name === p.email ? p.role : `${p.role} · ${p.email}`;
    return `<button type="button" class="person${on ? " is-on" : ""}" data-act="person" data-id="${esc(p.id)}" aria-pressed="${on}">
      <span class="ava" style="background:${p.color}">${esc(p.initials)}</span>
      <span><b>${esc(p.name === p.email ? p.email : p.name)}</b><small title="${esc(p.email)}">${esc(sub)}</small></span>
      ${on ? ICO.check : "<span></span>"}
    </button>`;
  }).join("");
  return add + rows;
}

function finalizeHTML() {
  const confs = CONFS.map((c) => `<button type="button" data-act="conf" data-id="${c.id}" class="${c.id === state.conference ? "is-on" : ""}">${esc(c.label)}</button>`).join("");
  return `
    ${kicker()}
    <h2>Review and send</h2>
    <div class="narrow">
      <div class="field">
        <span class="lbl">Conference</span>
        <div class="pop">
          <button type="button" class="select" data-act="conf-open" aria-expanded="${state.confOpen}" aria-haspopup="listbox">
            ${ICO.video}<span>${esc(confLabel())}</span>${ICO.chevD}
          </button>
          ${state.confOpen ? `<div class="menu" role="listbox">${confs}</div>` : ""}
        </div>
      </div>
      <div class="field">
        <span class="lbl">Feedback</span>
        <label class="check">
          <input type="checkbox" id="feedback" ${state.feedback ? "checked" : ""}>
          <span>Gather feedback from interviewers on BetterEngineer</span>
        </label>
      </div>
      <div class="field">
        <label class="lbl" for="notes">Note for Gabriel</label>
        <textarea class="notes" id="notes" placeholder="Anything he should know before the call">${esc(state.notes)}</textarea>
      </div>
    </div>`;
}

function sentHTML() {
  const len = lengthMeta();
  const names = selectedPeople().map((p) => p.name === p.email ? p.email : p.name);
  const who = names.length === 1 ? names[0] : `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
  const times = state.slots.map((s) => `<li>${esc(dayName(s.date))}, ${esc(rangeLabel(s.start, state.duration))}</li>`).join("");
  const feedback = state.feedback ? " Interviewers will leave feedback on BetterEngineer." : "";
  return `
    <div class="sent">
      <div class="sent-mark">${ICO.sent}</div>
      <h2>Invite sent</h2>
      <p>Gabriel will get ${state.slots.length} time options for a ${esc(len ? len.summary.toLowerCase() : "")} interview. ${esc(who)} ${names.length === 1 ? "is" : "are"} invited.${feedback}</p>
      <ul>${times}</ul>
      <p class="fine">${esc(confLabel())} · ${esc(zoneLabel())}</p>
    </div>`;
}

function paintStage() {
  const stage = document.getElementById("stage");
  stage.classList.toggle("is-focus", state.step === 0 || state.step === 3 || state.step === 4);
  if (state.step === 4) { stage.innerHTML = sentHTML(); return; }
  if (state.step === 0) {
    const rows = LENGTHS.map((l) => {
      const on = state.duration === l.min;
      return `<button type="button" class="len${on ? " is-on" : ""}" data-act="duration" data-min="${l.min}" aria-pressed="${on}"><span class="radio"></span><span><b>${l.label}</b><small>${l.hint}</small></span></button>`;
    }).join("");
    stage.innerHTML = `${kicker()}<h2>How long is the interview?</h2><p class="lede">This length is used for every time you suggest.</p><div class="lengths" role="radiogroup" aria-label="Interview length">${rows}</div>`;
    return;
  }
  if (state.step === 1) {
    const n = state.slots.length;
    const ready = n >= 3;
    stage.innerHTML = `
      ${kicker()}
      <div class="title-row">
        <h2>Suggest at least 3 times</h2>
        <span class="count${ready ? " is-ready" : ""}">${ready ? `${n} selected` : `${n} of 3`}</span>
      </div>
      <p class="lede">Blue dates and times are when Gabriel is free. You can still offer other times.</p>
      <div class="when">
        <div class="cal-col">${calendarHTML()}</div>
        <div class="time-col">${slotsHTML()}</div>
      </div>`;
    return;
  }
  if (state.step === 2) {
    stage.innerHTML = `
      ${kicker()}
      <div class="title-row">
        <h2>Who should be there?</h2>
        <span class="count" id="attendeeCount">${state.selected.size} invited</span>
      </div>
      <p class="lede">They receive the invite along with the times you suggested.</p>
      <div class="narrow">
        <label class="finder">
          <span class="mag">${ICO.mag}</span>
          <input id="peopleSearch" type="search" placeholder="Search or enter an email" autocomplete="off" value="${esc(state.query)}" aria-label="Search or enter an email">
        </label>
        <div class="people" id="peopleList">${peopleHTML()}</div>
      </div>`;
    return;
  }
  stage.innerHTML = finalizeHTML();
}

function paintActions() {
  const box = document.getElementById("actions");
  if (state.step === 4) {
    box.innerHTML = `<button type="button" class="btn-next" data-act="leave">Done</button>`;
    return;
  }
  const back = state.step > 0 ? `<button type="button" class="btn-back" data-act="back">Back</button>` : "";
  const label = state.step === 3 ? (state.sending ? "Sending…" : "Send invite") : "Continue";
  box.innerHTML = `${back}<p class="hint">${esc(hintText())}</p><button type="button" class="btn-next" data-act="next" ${canAdvance() ? "" : "disabled"}>${label}</button>`;
}

function paintPeopleOnly() {
  const list = document.getElementById("peopleList");
  if (list) list.innerHTML = peopleHTML();
  const count = document.getElementById("attendeeCount");
  if (count) count.textContent = `${state.selected.size} invited`;
  paintSummary();
  paintActions();
}

function paint() {
  const focusId = document.activeElement && document.activeElement.id;
  const pos = document.activeElement && document.activeElement.selectionStart;
  paintProgress();
  paintSummary();
  paintStage();
  paintActions();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (typeof pos === "number" && el.setSelectionRange) {
        try { el.setSelectionRange(pos, pos); } catch (err) { /* some inputs reject a caret range */ }
      }
    }
  }
}

function go(step) {
  if (step < 0 || step > 3 || step > state.step) return;
  state.step = step;
  state.tzOpen = false;
  state.confOpen = false;
  paint();
}

function next() {
  if (!canAdvance()) return;
  if (state.step < 3) {
    state.step += 1;
    if (state.step === 2) state.seenPeople = true;
    paint();
    return;
  }
  state.sending = true;
  paint();
  window.setTimeout(() => {
    state.sending = false;
    state.step = 4;
    paint();
  }, 450);
}

const app = document.getElementById("app");
app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || !app.contains(t)) return;
  const act = t.dataset.act;
  if (act === "tz-open" || act === "conf-open") e.stopPropagation();

  if (act === "goto") { go(Number(t.dataset.step)); return; }
  if (act === "back") { go(state.step - 1); return; }
  if (act === "next") { next(); return; }
  if (act === "leave") { leave(); return; }
  if (act === "duration") {
    state.duration = Number(t.dataset.min);
    state.slots = state.slots.filter((s) => s.start + state.duration <= hm(18));
    paint();
    return;
  }
  if (act === "month") {
    const dir = Number(t.dataset.dir);
    const dt = new Date(state.month.y, state.month.m + dir, 1);
    state.month = { y: dt.getFullYear(), m: dt.getMonth() };
    state.tzOpen = false;
    paint();
    return;
  }
  if (act === "day") {
    const key = t.dataset.date;
    const dt = parseKey(key);
    state.cursor = key;
    state.month = { y: dt.getFullYear(), m: dt.getMonth() };
    state.tzOpen = false;
    paint();
    return;
  }
  if (act === "slot" || act === "unslot") {
    if (act === "unslot") e.stopPropagation();
    toggleSlot(t.dataset.date, Number(t.dataset.start));
    paint();
    return;
  }
  if (act === "person") {
    const id = t.dataset.id;
    if (state.selected.has(id)) state.selected.delete(id);
    else state.selected.add(id);
    paintPeopleOnly();
    return;
  }
  if (act === "unperson") {
    e.stopPropagation();
    state.selected.delete(t.dataset.id);
    paint();
    return;
  }
  if (act === "add-email") {
    addEmail(state.query);
    paint();
    const input = document.getElementById("peopleSearch");
    if (input) input.focus();
    return;
  }
  if (act === "tz-open") {
    state.tzOpen = !state.tzOpen;
    state.confOpen = false;
    paint();
    return;
  }
  if (act === "tz") {
    state.tz = t.dataset.id;
    state.tzOpen = false;
    paint();
    return;
  }
  if (act === "conf-open") {
    state.confOpen = !state.confOpen;
    state.tzOpen = false;
    paint();
    return;
  }
  if (act === "conf") {
    state.conference = t.dataset.id;
    state.confOpen = false;
    paint();
  }
});

app.addEventListener("input", (e) => {
  if (e.target.id === "peopleSearch") {
    state.query = e.target.value;
    paintPeopleOnly();
  }
  if (e.target.id === "notes") state.notes = e.target.value;
});
app.addEventListener("change", (e) => {
  if (e.target.id === "feedback") state.feedback = e.target.checked;
});
app.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "peopleSearch") {
    e.preventDefault();
    if (isEmail(state.query.trim())) {
      addEmail(state.query);
      paint();
      const input = document.getElementById("peopleSearch");
      if (input) input.focus();
    }
  }
});

document.addEventListener("click", (e) => {
  if (e.target.closest(".menu, [data-act='tz-open'], [data-act='conf-open']")) return;
  if (state.tzOpen || state.confOpen) {
    state.tzOpen = false;
    state.confOpen = false;
    paint();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (state.tzOpen || state.confOpen)) {
    state.tzOpen = false;
    state.confOpen = false;
    paint();
  }
});

paint();
</script>
</body>
</html>
